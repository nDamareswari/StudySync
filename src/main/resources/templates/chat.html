<!DOCTYPE html>
<html>
<head>
    <title>Chat</title>
    <style>
        body {
            font-family: 'Segoe UI';
            background: #556b2f;
            margin: 0;
        }

        .chat-box {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        input {
            width: 80%;
            padding: 10px;
        }

        button {
            padding: 10px;
        }
    </style>
</head>
<body>

<div class="chat-box">
    <h3>Chat (Demo)</h3>

    <input type="text" placeholder="Type message..." />
    <button>Send</button>
</div>

</body>
</html>
