<!DOCTYPE html>
<html>
<head>
    <title>Settings</title>
    <style>
        body {
            font-family: 'Segoe UI';
            background: #556b2f;
            margin: 0;
        }

        .box {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        button {
            margin-top: 10px;
            padding: 10px;
        }
    </style>
</head>
<body>

<div class="box">
    <h3>Settings</h3>

    <label>Change Username</label>
    <input type="text" placeholder="Enter new username" />

    <label>Change Password</label>
    <input type="password" placeholder="Enter new password" />

    <button>Save</button>
</div>

</body>
</html>
