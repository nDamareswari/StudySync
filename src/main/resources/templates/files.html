<!DOCTYPE html>
<html>
<head>
    <title>Files</title>
    <style>
        body {
            font-family: 'Segoe UI',sans-serif;
            background: #556b2f;
            margin: 0;
        }

        .container {
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.05);
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        a {
            margin-left: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>All Files</h2>

        <ul>
            <li th:each="file : ${files}">
                <span th:text="${file.fileName}"></span>

                <a th:href="@{/download/{id}(id=${file.id})}">⬇</a>
                <a th:href="@{/delete/{id}(id=${file.id})}" style="color:red;">❌</a>
            </li>
        </ul>
    </div>
</div>

</body>
</html>
