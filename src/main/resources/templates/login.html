<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #fbc2eb, #a6c1ee);
        }

        .login-box {
            width: 320px;
            padding: 25px;
            background: #ffffff;
            margin: 100px auto;
            border-radius: 15px;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 {
            color: #555;
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: #f7a8b8;
        }

        button {
            padding: 10px;
            width: 100%;
            background: #f7a8b8; /* peach */
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #f28ca3; /* darker peach */
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Welcome Back </h2>

    <form action="/login" method="post">
        <input type="text" name="username" />
        <input type="password" name="password" />
        <button type="submit">Login</button>
    </form>

    <script>
        function setRole() {
            let username = document.getElementById("username").value;

            if (username === "4CSE17") {
                sessionStorage.setItem("role", "ADMIN");
            } else {
                sessionStorage.setItem("role", "USER");
            }
        }
    </script>
</div>

</body>
</html>
